<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing URL Analyzer - Command Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 1.1em;
        }

        .scan-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        #urlInput {
            flex: 1;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        #urlInput:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.15);
        }

        #scanBtn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        #scanBtn:hover {
            transform: translateY(-2px);
        }

        #scanBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        .verdict-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            border-left: 5px solid;
        }

        .verdict-card.safe {
            border-left-color: #10b981;
        }

        .verdict-card.suspicious {
            border-left-color: #f59e0b;
        }

        .verdict-card.malicious {
            border-left-color: #ef4444;
        }

        .verdict-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9em;
        }

        .status-badge.safe {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .status-badge.suspicious {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .status-badge.malicious {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .risk-score {
            font-size: 3em;
            font-weight: bold;
        }

        .risk-score.safe { color: #10b981; }
        .risk-score.suspicious { color: #f59e0b; }
        .risk-score.malicious { color: #ef4444; }

        .recommendation {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 1.1em;
        }

        .details-section {
            margin-top: 20px;
        }

        .detail-item {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            margin: 10px 0;
            border-radius: 8px;
        }

        .detail-label {
            color: #9ca3af;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .detail-value {
            color: #e0e0e0;
            font-size: 1.1em;
        }

        .reasons-list {
            list-style: none;
            margin-top: 15px;
        }

        .reasons-list li {
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            margin: 8px 0;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }

        .layers-checked {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .layer-badge {
            padding: 5px 15px;
            border-radius: 15px;
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            font-size: 0.85em;
        }

        .error-message {
            display: none;
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ Phishing URL Analyzer</h1>
            <p class="subtitle">Multi-Layer Threat Detection System</p>
        </header>

        <div class="scan-section">
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="Enter URL to scan (e.g., https://example.com)" />
                <button id="scanBtn" onclick="scanURL()">Scan URL</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 15px;">Analyzing URL through all detection layers...</p>
            </div>

            <div class="error-message" id="errorMessage"></div>
        </div>

        <div class="results" id="results">
            <div class="verdict-card" id="verdictCard">
                <div class="verdict-header">
                    <div>
                        <h2 id="urlScanned" style="margin-bottom: 10px; word-break: break-all;"></h2>
                        <span class="status-badge" id="statusBadge"></span>
                    </div>
                    <div class="risk-score" id="riskScore"></div>
                </div>

                <div class="recommendation" id="recommendation"></div>

                <div class="detail-item">
                    <div class="detail-label">Verdict Source</div>
                    <div class="detail-value" id="verdictSource"></div>
                </div>

                <div class="details-section">
                    <h3 style="margin-bottom: 15px;">Detection Reasons</h3>
                    <ul class="reasons-list" id="reasonsList"></ul>
                </div>

                <div class="details-section" id="layersSection">
                    <h3 style="margin-bottom: 15px;">Layers Checked</h3>
                    <div class="layers-checked" id="layersChecked"></div>
                </div>

                <div class="details-section" id="urlFeaturesSection">
                    <h3 style="margin-bottom: 15px;">URL Features</h3>
                    <div class="detail-item">
                        <div class="detail-label">Domain</div>
                        <div class="detail-value" id="domain"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">URL Length</div>
                        <div class="detail-value" id="urlLength"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Uses IP Address</div>
                        <div class="detail-value" id="isIP"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function scanURL() {
            const urlInput = document.getElementById('urlInput');
            const url = urlInput.value.trim();
            
            if (!url) {
                showError('Please enter a URL to scan');
                return;
            }

            // Reset UI
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('scanBtn').disabled = true;

            try {
                const response = await fetch('/api/v1/scan', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url: url })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to scan URL');
                }

                const data = await response.json();
                displayResults(data);
            } catch (error) {
                showError(error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('scanBtn').disabled = false;
            }
        }

        function displayResults(data) {
            const verdictCard = document.getElementById('verdictCard');
            verdictCard.className = `verdict-card ${data.status}`;

            document.getElementById('urlScanned').textContent = data.url;
            document.getElementById('statusBadge').textContent = data.status;
            document.getElementById('statusBadge').className = `status-badge ${data.status}`;
            
            document.getElementById('riskScore').textContent = data.risk_score;
            document.getElementById('riskScore').className = `risk-score ${data.status}`;
            
            document.getElementById('recommendation').textContent = data.recommendation || '';
            document.getElementById('verdictSource').textContent = data.verdict_source;

            // Reasons
            const reasonsList = document.getElementById('reasonsList');
            reasonsList.innerHTML = '';
            data.reasons.forEach(reason => {
                const li = document.createElement('li');
                li.textContent = reason;
                reasonsList.appendChild(li);
            });

            // Layers checked
            if (data.details && data.details.layers_triggered) {
                const layersDiv = document.getElementById('layersChecked');
                layersDiv.innerHTML = '';
                data.details.layers_triggered.forEach(layer => {
                    const badge = document.createElement('span');
                    badge.className = 'layer-badge';
                    badge.textContent = layer.replace('_', ' ').toUpperCase();
                    layersDiv.appendChild(badge);
                });
            }

            // URL Features
            if (data.details && data.details.url_features) {
                const features = data.details.url_features;
                document.getElementById('domain').textContent = features.domain || 'N/A';
                document.getElementById('urlLength').textContent = (features.url_length || 0) + ' characters';
                document.getElementById('isIP').textContent = features.is_ip ? 'Yes ⚠️' : 'No ✓';
            }

            document.getElementById('results').style.display = 'block';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // Allow Enter key to scan
        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                scanURL();
            }
        });
    </script>
</body>
</html>
