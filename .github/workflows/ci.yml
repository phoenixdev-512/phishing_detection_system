name: TGIS CI Pipeline

on:
  push:
    branches: [ main, protect-master ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install Linting dependencies
      run: pip install ruff black
    - name: Black Formatting
      run: black --check app/ tests/
    - name: Ruff Linter
      run: ruff check app/ tests/

  type-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install mypy
      run: pip install mypy networkx pydantic
    - name: Mypy Check
      run: mypy app/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov
    - name: Run Pytest
      run: pytest tests/ -v --cov=app --cov-report=term-missing

  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Install Frontend deps
      working-directory: ./frontend
      run: npm ci
    - name: Run Vue/React Tests
      working-directory: ./frontend
      run: npm run test

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install Bandit
      run: pip install bandit
    - name: Bandit Scan
      run: bandit -r app/ -ll
